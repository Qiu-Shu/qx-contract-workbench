- insert:
    - id: qx-upload-privacy
      name: D:/qx-harness-workbench-20261102/plugins/privacy/index.mjs
      config:
        workspace: D:/qx-harness-workbench-20261102/workspace
        python: D:/qx-contract-workbench-20261102/.venv/Scripts/python.exe

# qunxing-model-recovery-v1
# Retry only the failed model request. The official loop retains completed tool results.
- id: llm-deepseek
  config:
    retryPolicy:
      mode: normal
      maxRetries: 5
      retryableCodes:
        - EMPTY_RESPONSE
        - RATE_LIMIT
        - SERVER
        - TIMEOUT
        - TRANSPORT
        - MALFORMED_RESPONSE
        - STREAM_CLOSED
