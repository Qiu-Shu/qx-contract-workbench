<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>本人微信 · AI师兄法律助手平台</title>
<style>body{margin:0;background:#f7f8fa;color:#20242b;font:15px/1.65 system-ui,sans-serif}main{max-width:680px;margin:48px auto;padding:28px;background:white;border:1px solid #e8e9ee;border-radius:16px}h1{font-size:23px;margin:0 0 12px}p{color:#566070}button,input{font:inherit;border:1px solid #d9dde5;border-radius:8px;padding:9px 13px;background:white;color:inherit}button{cursor:pointer}button.primary{background:#3568e8;color:white;border-color:#3568e8}button:disabled{opacity:.5;cursor:wait}input{width:min(400px,80%)}.actions{display:flex;flex-wrap:wrap;gap:8px}#qr{display:block;width:240px;height:240px;margin:22px auto}#qr[hidden]{display:none}#error{white-space:pre-wrap;color:#a32929}#owner,#workspace{overflow-wrap:anywhere}label{display:block;margin:22px 0 8px}.muted{font-size:13px;color:#667085}@media(max-width:700px){main{margin:12px;padding:20px}}</style>
<main><h1>本人微信</h1><p>扫码后，用自己的微信给工作台发送文字、图片和文件。处理结果会回到同一微信；桌面与微信沿用下方会话。</p>
<p id="status" role="status" aria-live="polite">正在读取本机状态…</p><p id="owner"></p>
<p id="batching" role="status" aria-live="polite">等待新消息</p><p class="muted">连续消息会合并处理：文字停发 8 秒、附件停发 12 秒后开始。还要补充可说“还没发完”，准备好后说“发完了”或“就这些”。</p>
<div class="actions"><button class="primary" data-action="login">扫码连接</button><button data-action="cancel">取消扫码</button><button data-action="pause">暂停</button><button data-action="resume">恢复连接</button></div>
<img id="qr" alt="使用本人微信扫描此二维码" hidden><div id="verify" hidden><label for="code">手机显示的验证码</label><input id="code" autocomplete="one-time-code"><button data-action="verify">提交验证码</button></div>
<p id="error" role="alert"></p><label for="session">共用会话编号</label><input id="session"><button data-action="session">保存</button>
<p class="muted">首次发送会创建此会话；以后始终恢复同一会话。在工作台历史中打开它即可续聊。要绑定已有桌面对话，先暂停微信，再把该对话的会话编号填入。</p>
<p class="muted" id="workspace"></p><p class="muted">仅接收扫码本人的私聊。不会处理客户或群消息。文件进入当前工作区的 wechat-inbox 文件夹。</p></main>
<script>
const $=id=>document.getElementById(id);let editing=false;
$('session').addEventListener('input',()=>editing=true);
async function refresh(){try{const response=await fetch('/qx-wechat/state');const s=await response.json();if(!response.ok)throw new Error(s.error);$('status').textContent=s.connected?'微信已接通':s.login&&!['confirmed','cancelled','error','give_up'].includes(s.login.status)?'请在手机上完成扫码确认':'等待连接本人微信';const b=s.batching??{};$('batching').textContent=[b.active?'正在处理当前批次':null,b.pendingMessages?(b.held?'已收集 '+b.pendingMessages+' 条，等待你说“发完了”':!s.connected?'已保留 '+b.pendingMessages+' 条（接收已暂停）':b.active?'已收集下一批 '+b.pendingMessages+' 条':'正在收集连续消息，共 '+b.pendingMessages+' 条'):null,b.failed?'有 '+b.failed+' 批未完成，可按批次号查看本机记录':null,b.lastBatch?.warningCount?'上一批有 '+b.lastBatch.warningCount+' 条附件接收异常，回复中会说明未读取项':null].filter(Boolean).join('；')||'等待新消息';$('owner').textContent=s.owner?'已绑定本人：'+s.owner:'';if(!editing)$('session').value=s.sessionId;$('workspace').textContent='工作区：'+s.workspace;$('error').textContent=s.lastError||s.login?.error||'';const show=s.login?.qrImage&&!['confirmed','cancelled','error','give_up'].includes(s.login.status);$('qr').hidden=!show;if(show)$('qr').src=s.login.qrImage;$('verify').hidden=!s.login?.verifyCodeNeeded;}catch(e){$('error').textContent=e.message;}}
document.querySelectorAll('[data-action]').forEach(button=>button.addEventListener('click',async()=>{button.disabled=true;try{const response=await fetch('/qx-wechat/action',{method:'POST',headers:{'content-type':'application/json','x-qx-token':'__QX_CSRF__'},body:JSON.stringify({action:button.dataset.action,sessionId:$('session').value.trim(),code:$('code').value.trim()})});const result=await response.json();if(!response.ok)throw new Error(result.error);if(button.dataset.action==='session')editing=false;await refresh();}catch(e){$('error').textContent=e.message;}finally{button.disabled=false;}}));refresh();setInterval(refresh,2500);
</script></html>
