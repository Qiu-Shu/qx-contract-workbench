<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'"><title>AI师兄法律助手平台</title>
<style>
*{box-sizing:border-box}body{font:16px/1.7 system-ui,sans-serif;color:#26334a;background:#fff;margin:0;padding:clamp(24px,10vw,96px)}
main{max-width:640px;margin:12vh auto}h1{font-size:26px;line-height:1.4;font-weight:600;margin:0 0 20px}p{color:#536176;overflow-wrap:anywhere}
#qx-startup-time{font-size:14px;font-variant-numeric:tabular-nums;min-height:24px}nav{display:flex;gap:12px;flex-wrap:wrap;margin:28px 0}
button{font:inherit;min-height:44px;border:1px solid #8995a6;border-radius:6px;padding:9px 18px;background:#fff;color:#26334a;cursor:pointer}
button:first-child{background:#26334a;color:#fff;border-color:#26334a}button:hover{filter:brightness(.94)}button:disabled{opacity:.65;cursor:wait}
button:focus-visible{outline:3px solid #486fa3;outline-offset:3px}::selection{background:#dbe7f7}footer{border-top:1px solid #dbe1e8;padding-top:20px;font-size:14px;color:#536176}
</style></head><body><main>
<h1 id="qx-startup-heading">正在打开工作台</h1>
<p id="qx-startup-detail" role="status" aria-live="polite">正在检查本机连接，请稍候。</p>
<p id="qx-startup-time"></p>
<nav aria-label="启动操作"><button id="qx-startup-retry" type="button" disabled>正在连接…</button><button id="qx-startup-logs" type="button">打开运行日志</button></nav>
<footer>已保存的聊天和材料仍保留在本机。中断的任务不会自动重发。</footer>
</main></body></html>
